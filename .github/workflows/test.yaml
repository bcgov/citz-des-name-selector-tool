name: Test
permissions:
    contents: read

on:
    push:
        branches: [dev]
    workflow_dispatch:

# Cancel any currently running builds to save GitHub Actions hours.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test-suite:
        name: Test suite
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Read .bun-version
              run: echo "GITHUB_BUN_VERSION=$(cat .bun-version)" >> $GITHUB_ENV

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.GITHUB_BUN_VERSION }}

            - name: Install dependencies
              run: bun install

            # Errors in Svelte check script cause this job to fail
            # See: https://svelte.dev/docs/cli/sv-check
            - name: Svelte check
              run: bun run check

            # Errors in Prettier check script cause this job to fail
            # See: https://prettier.io/docs/cli#--check
            - name: Prettier format check
              run: bun run format:check

            - name: Run test suite
              run: bun run test

            # Treat failures in the Vite build as test failures.
            # We don't need to keep the artifact of this build,
            # we just care that it completes successfully.
            - name: Run Vite build
              run: bun run build
